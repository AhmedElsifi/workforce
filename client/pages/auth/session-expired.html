<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkForce Portal - Session Expired</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/auth/unauthorized.css" />
  </head>
  <body>
    <div class="error-page-wrapper">
      <div class="error-container">
        <div class="error-icon">
          <span class="material-symbols-outlined">hourglass_disabled</span>
        </div>

        <h1 class="error-title">401 - Session Expired</h1>

        <p class="error-message">
          Your session has expired or you are not signed in. Please sign in
          again to continue using WorkForce.
        </p>

        <div class="error-actions">
          <a href="../../index.html" class="btn btn-primary">
            <span class="material-symbols-outlined">login</span>
            Sign In
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
