<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkForce Portal - Sidebar</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/employee/sidebar.css" />
    <link rel="stylesheet" href="../../assets/css/employee/profile.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Mobile Top Bar -->
      <header class="mobile-top-bar">
        <div class="brand">WorkForce</div>
        <div class="user-actions">
          <span>David Chen</span>
          <span class="material-symbols-outlined">logout</span>
        </div>
      </header>

      <!-- Desktop Sidebar -->
      <aside class="sidebar">
        <div class="logo-section">
          <div class="logo-icon">
            <span class="material-symbols-outlined">corporate_fare</span>
          </div>
          <div class="logo-text">
            <h1>WorkForce</h1>
            <span>Employee Portal</span>
          </div>
        </div>

        <nav class="nav-menu">
          <div class="nav-label">Navigation</div>
          <ul>
            <li>
              <a href="./dashboard.html" class="nav-item">
                <div class="nav-left">
                  <span class="material-symbols-outlined nav-icon"
                    >dashboard</span
                  >
                  <span>Dashboard</span>
                </div>
              </a>
            </li>
            <li>
              <a href="./attendance.html" class="nav-item">
                <div class="nav-left">
                  <span class="material-symbols-outlined nav-icon">
                    history
                  </span>
                  <span>Attendance</span>
                </div>
              </a>
            </li>
            <li>
              <a href="./leave-requests.html" class="nav-item">
                <div class="nav-left">
                  <span class="material-symbols-outlined nav-icon">
                    description
                  </span>
                  <span>My Leave Requests</span>
                </div>
                <span class="badge">2 Pending</span>
              </a>
            </li>
            <li>
              <a href="./profile.html" class="nav-item active">
                <div class="nav-left">
                  <span class="material-symbols-outlined nav-icon">person</span>
                  <span>My Profile</span>
                </div>
              </a>
            </li>
          </ul>
        </nav>

        <div class="user-profile">
          <div class="user-info">
            <div class="avatar">DC</div>
            <div class="user-text">
              <h4 id="employee-username"></h4>
              <p id="employee-position"></p>
            </div>
          </div>
          <div class="logout-btn">
            <span class="material-symbols-outlined">logout</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content"></main>

      <!-- Mobile Bottom Navigation -->
      <nav class="mobile-bottom-nav">
        <a href="./dashboard.html" class="mobile-nav-item">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Home</span>
        </a>
        <a href="./attendance.html" class="mobile-nav-item">
          <span class="material-symbols-outlined">history</span>
          <span>Attendance</span>
        </a>
        <a href="./leave-requests.html" class="mobile-nav-item">
          <span class="material-symbols-outlined">description</span>
          <span>Leave</span>
        </a>
        <a href="./profile.html" class="mobile-nav-item active">
          <span class="material-symbols-outlined">person</span>
          <span>Profile</span>
        </a>
      </nav>
    </div>
  </body>
</html>
